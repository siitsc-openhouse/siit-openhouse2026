<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find your path | SIIT</title>

  <!-- ฟอนต์จาก Google Fonts (ถ้าไม่มีอินเทอร์เน็ต เว็บจะใช้ฟอนต์ในเครื่องแทน) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@300;400;500;600&display=swap">

  <!-- หน้าตาทั้งหมดอยู่ในไฟล์นี้ -->
  <link rel="stylesheet" href="style.css">

    <!-- ใส่ธีมที่เคยเลือกไว้ก่อนหน้าเว็บจะวาด (กันจอกระพริบเป็นสีสว่างก่อน) -->
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
</head>
<body>

  <!-- เมนูด้านบน อยู่นอก #app จึงไม่หายตอนเปลี่ยนหน้า (data-view = หน้าที่จะไป, ไอคอนธีมใส่โดย script.js) -->
  <header class="navbar">
    <div class="navbar-inner">
      <button class="nav-brand" type="button" data-view="home">SIIT</button>
      <nav class="nav-links">
        <button type="button" data-view="depts">ข้อมูลภาค</button>
        <button type="button" data-view="docs">เอกสาร</button>
        <button type="button" data-view="credits">เครดิต</button>
      </nav>
      <!-- เพลงพื้นหลัง: กดเพื่อเล่น/หยุด เล่นวนซ้ำ (เบราว์เซอร์ไม่ยอมให้เล่นเองตอนเปิดเว็บ ต้องกดก่อน) -->
      <button class="theme-toggle" id="music-toggle" type="button"></button>
      <audio id="bgm" src="audio/after-the-rain.mp3" loop preload="none"></audio>
      <button class="theme-toggle" id="theme-toggle" type="button"></button>
    </div>
  </header>
  <!-- กล่องหลักของเกม script.js จะเปลี่ยนเนื้อหาข้างในทีละหน้า -->
  <main id="app" class="app"></main>

  <!-- โหลดข้อมูลก่อน แล้วค่อยโหลดตัวควบคุมเกม (ลำดับสำคัญ) -->
  <script src="results.js"></script>
  <script src="questions.js"></script>
  <script src="questions-quick.js"></script>
  <script src="pages.js"></script>
  <script src="script.js"></script>
  <script src="card.js"></script>
</body>
</html>
