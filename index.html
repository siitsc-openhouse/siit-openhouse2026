<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find your path | SIIT</title>

  <!-- ฟอนต์จาก Google Fonts (ถ้าไม่มีอินเทอร์เน็ต เว็บจะใช้ฟอนต์ในเครื่องแทน) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@300;400;500;600&display=swap">

  <!-- หน้าตาทั้งหมดอยู่ในไฟล์นี้ -->
  <link rel="stylesheet" href="style.css">

    <!-- ใส่ธีมที่เคยเลือกไว้ก่อนหน้าเว็บจะวาด (กันจอกระพริบเป็นสีสว่างก่อน) -->
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
</head>
<body>

  <!-- ปุ่มเปลี่ยนธีมสว่าง/มืด (ไอคอนใส่โดย script.js) อยู่นอก #app จึงไม่หายตอนเปลี่ยนหน้า -->
  <button class="theme-toggle" id="theme-toggle" type="button"></button>
  <!-- กล่องหลักของเกม script.js จะเปลี่ยนเนื้อหาข้างในทีละหน้า -->
  <main id="app" class="app"></main>

  <!-- โหลดข้อมูลก่อน แล้วค่อยโหลดตัวควบคุมเกม (ลำดับสำคัญ) -->
  <script src="results.js"></script>
  <script src="questions.js"></script>
  <script src="questions-quick.js"></script>
  <script src="script.js"></script>
  <script src="card.js"></script>
</body>
</html>
